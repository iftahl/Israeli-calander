<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>לוח ישראלי</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172b4d;background:#f3f6f8;--official:#b42318;--eve:#b54708;--observance:#175cd3;--education:#067647;--schoolNote:#6941c6}
*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:5;background:rgba(243,246,248,.94);backdrop-filter:blur(14px);padding:12px 0 8px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px}.title h1{font-size:22px;margin:0}.updated{font-size:11px;color:#667085}.controls{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:10px}.controls button,.today,.filter{border:1px solid #d0d5dd;background:white;border-radius:12px;min-height:42px;font-size:17px}.month{text-align:center;font-weight:700;background:white;border:1px solid #d0d5dd;border-radius:12px;padding:10px}.tools{display:flex;gap:8px;margin-top:8px}.today,.filter{padding:8px 12px;font-size:14px}.filter{flex:1}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{font-size:12px;font-weight:700;color:#667085;text-align:center;padding:10px 0 6px}.grid{gap:4px}.day{position:relative;min-height:92px;background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:6px;overflow:hidden}.day.out{opacity:.33}.day.today-cell{outline:2px solid #0f766e}.num{font-weight:700}.heb{font-size:10px;color:#667085;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dots{display:flex;gap:3px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%}.labels{margin-top:4px;display:flex;flex-direction:column;gap:3px}.tag{font-size:9px;line-height:1.2;color:white;border-radius:4px;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;font-size:12px}.legend span{background:white;border-radius:999px;padding:6px 9px;border:1px solid #e4e7ec}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}.panel{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin-top:12px}.panel h2{font-size:17px;margin:0 0 8px}.event{border-right:4px solid;padding:8px 10px;margin:6px 0;background:#f9fafb;border-radius:8px}.event b{display:block}.event small{color:#667085}.notice{font-size:12px;color:#667085;line-height:1.5}.error{color:#b42318}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet select{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #d0d5dd}.sheet button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#0f766e;color:white;font-size:16px}.checkbox{display:flex;align-items:center;gap:8px;margin-top:12px}.checkbox input{width:20px;height:20px}@media(max-width:600px){.day{min-height:76px;padding:4px}.tag{font-size:8px}.heb{font-size:9px}.grid{gap:2px}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="title"><h1>🇮🇱 לוח ישראלי</h1><span class="updated" id="updated"></span></div>
<div class="controls"><button id="next" aria-label="החודש הבא">›</button><div class="month" id="month"></div><button id="prev" aria-label="החודש הקודם">‹</button></div>
<div class="tools"><button class="today" id="today">היום</button><button class="filter" id="openFilter">⚙️ חופשות: <span id="groupLabel">גנים ויסודי</span></button></div></div>
<div class="legend" id="legend"></div><div class="week"><div>א׳</div><div>ב׳</div><div>ג׳</div><div>ד׳</div><div>ה׳</div><div>ו׳</div><div>שבת</div></div><div class="grid" id="grid"></div>
<section class="panel"><h2 id="detailsTitle">בחרו יום בלוח</h2><div id="details" class="notice">בלחיצה על יום יוצגו כאן כל החגים והחופשות.</div></section>
<section class="panel notice" id="note"></section></main>
<div class="modal" id="modal"><div class="sheet"><h2>הצגת חופשות משרד החינוך</h2><label for="group">שכבת גיל</label><select id="group"><option value="kindergarten">גן ילדים</option><option value="elementary">בית ספר יסודי</option><option value="middle">חטיבת ביניים</option><option value="high">תיכון</option><option value="all">כל השכבות</option></select><label class="checkbox"><input type="checkbox" id="showEducation" checked> הצג חופשות משרד החינוך</label><button id="closeFilter">שמירה וסגירה</button></div></div>
<script>
const state={date:new Date(),data:null,group:localStorage.group||'elementary',showEducation:localStorage.showEducation!=='false'};
const $=s=>document.querySelector(s); const pad=n=>String(n).padStart(2,'0'); const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const groupNames={kindergarten:'גן ילדים',elementary:'יסודי',middle:'חטיבת ביניים',high:'תיכון',all:'כל השכבות'};
const monthFmt=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}); const fullFmt=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); const hebFmt=new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'short'});
async function loadData(){try{const r=await fetch(`data/calendar-data.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(r.status);state.data=await r.json();localStorage.calendarData=JSON.stringify(state.data)}catch(e){if(localStorage.calendarData)state.data=JSON.parse(localStorage.calendarData);else throw e}}
function inRange(s,a,b){return s>=a&&s<=b} function itemsFor(s){let x=state.data.events.filter(e=>e.date===s);if(state.showEducation)x=x.concat(state.data.educationVacations.filter(v=>inRange(s,v.start,v.end)&&(state.group==='all'||v.groups.includes(state.group))).map(v=>({...v,category:'education'})));return x}
function renderLegend(){const cats=state.data.categories;$('#legend').innerHTML=Object.entries(cats).filter(([k])=>k!=='schoolNote').map(([k,v])=>`<span><i style="background:${v.color}"></i>${v.label}</span>`).join('')}
function render(){const y=state.date.getFullYear(),m=state.date.getMonth();$('#month').textContent=monthFmt.format(state.date);$('#updated').textContent=`נתונים: ${state.data.meta.lastUpdated}`;$('#groupLabel').textContent=state.showEducation?groupNames[state.group]:'מוסתר';const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d),items=itemsFor(s),out=d.getMonth()!==m,today=s===iso(new Date());html+=`<button class="day ${out?'out':''} ${today?'today-cell':''}" data-date="${s}"><div class="num">${d.getDate()}</div><div class="heb">${hebFmt.format(d)}</div><div class="dots">${[...new Set(items.map(x=>x.category))].map(c=>`<i class="dot" style="background:${state.data.categories[c].color}"></i>`).join('')}</div><div class="labels">${items.slice(0,2).map(x=>`<span class="tag" style="background:${state.data.categories[x.category].color}">${x.name}</span>`).join('')}</div></button>`}$('#grid').innerHTML=html;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>showDay(b.dataset.date))}
function showDay(s){const d=new Date(s+'T12:00:00'),items=itemsFor(s);$('#detailsTitle').textContent=fullFmt.format(d);$('#details').innerHTML=items.length?items.map(x=>`<div class="event" style="border-color:${state.data.categories[x.category].color}"><b>${x.name}</b><small>${state.data.categories[x.category].label}${x.groups?' · '+x.groups.map(g=>groupNames[g]).join(', '):''}</small></div>`).join(''):'<span class="notice">אין אירוע מיוחד ביום זה.</span>'}
function changeMonth(n){state.date=new Date(state.date.getFullYear(),state.date.getMonth()+n,1);render()}
(async()=>{try{await loadData();renderLegend();render();$('#note').innerHTML=`${state.data.meta.note}<br>גרסת נתונים: ${state.data.meta.dataVersion}. לעריכת תאריכים יש לשנות רק את <b>data/calendar-data.json</b>.`;$('#prev').onclick=()=>changeMonth(-1);$('#next').onclick=()=>changeMonth(1);$('#today').onclick=()=>{state.date=new Date();render();showDay(iso(new Date()))};$('#group').value=state.group;$('#showEducation').checked=state.showEducation;$('#openFilter').onclick=()=>$('#modal').classList.add('open');$('#closeFilter').onclick=()=>{state.group=$('#group').value;state.showEducation=$('#showEducation').checked;localStorage.group=state.group;localStorage.showEducation=state.showEducation;$('#modal').classList.remove('open');render()};$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}catch(e){document.body.innerHTML=`<p class="error" style="padding:20px">לא ניתן לטעון את קובץ הנתונים. ודאו שהתיקייה data הועלתה ל-GitHub Pages.</p>`}})();
</script></body></html>
